name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --deny-warnings
      - name: Backend lint
        working-directory: backend
        run: |
          npm ci
          npm run lint -- --deny-warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Backend image
        run: |
          docker build -t workit-backend backend
          docker save workit-backend | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            frontend/coverage
            backend/coverage

  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mikitsa/workit-backend:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: actions/download-artifact@v8
        with:
          name: backend-image
      - name: Frontend deploy (Netlify)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27 deploy --prod --no-build --dir frontend-dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image push (GHCR)
        run: |
          docker load --input backend-image.tar.gz
          docker tag workit-backend "$IMAGE"
          docker push "$IMAGE"
      - name: Backend deploy (Render)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}"
