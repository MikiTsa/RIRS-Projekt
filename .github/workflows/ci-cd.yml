name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --deny-warnings
      - name: Backend lint
        working-directory: backend
        run: |
          npm ci
          npm run lint -- --deny-warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Backend image
        run: |
          docker build -t workit-backend backend
          docker save workit-backend | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            frontend/coverage
            backend/coverage
